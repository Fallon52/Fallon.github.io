<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 班级管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fff5f8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .nav-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .main-title {
            font-size: 42px;
            color: #d63384;
            margin-bottom: 40px;
            text-shadow: 2px 2px 5px rgba(255, 182, 193, 0.6);
        }

        .card-box {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-card {
            width: 240px;
            height: 300px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(255, 105, 180, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #ffb6c1;
            text-decoration: none;
        }

        .nav-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(255, 105, 180, 0.3);
            border-color: #ff69b4;
        }

        .card-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 22px;
            color: #9f2b68;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-desc {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <h1 class="main-title">🏫 初二3班 管理系统</h1>
        <div class="card-box">
            <!-- 作业登记系统 -->
            <a href="作业登记.html" class="nav-card">
                <div class="card-icon">🎀</div>
                <div class="card-title">作业登记系统</div>
                <div class="card-desc">Homework Registration</div>
            </a>

            <!-- 考勤系统 -->
            <a href="考勤系统.html" class="nav-card">
                <div class="card-icon">🐱</div>
                <div class="card-title">班级考勤系统</div>
                <div class="card-desc">Attendance System</div>
            </a>
        </div>
    </div>
</body>
</html>
