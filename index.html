<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 初二3班 管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #fdf2f8; /* 粉色背景 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 标题栏样式 - 粉色主题 */
        .header {
            background-color: #e6398b; /* 主粉色 */
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(230, 57, 139, 0.2);
        }

        /* 导航按钮区域 */
        .nav-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 40px 20px;
        }

        .nav-btn {
            width: 240px; /* 加宽适配新文字 */
            height: 140px; /* 加高提升视觉 */
            background-color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            color: #e6398b;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(230, 57, 139, 0.15);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(230, 57, 139, 0.2);
            background-color: #fff5f8; /* 浅粉色hover背景 */
        }

        .nav-btn i {
            font-size: 40px; /* 加大图标 */
            color: #e6398b;
        }

        /* 公告栏样式 - 粉色主题 */
        .notice-section {
            padding: 20px;
            background-color: #fff;
            margin: 0 20px 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(230, 57, 139, 0.1);
            border: 1px solid #ffc2d1;
        }

        .notice-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e6398b;
            font-weight: bold;
        }

        .notice-edit {
            padding: 8px 15px;
            background-color: #e6398b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .notice-edit:hover {
            background-color: #d63384;
            transform: translateY(-2px);
        }

        .notice-content {
            min-height: 100px;
            padding: 15px;
            border: 1px solid #ffc2d1;
            border-radius: 8px;
            background-color: #fff5f8;
            color: #555;
            line-height: 1.6;
            cursor: pointer;
        }

        /* 全屏公告弹窗 - 粉色主题 */
        .fullscreen-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(230, 57, 139, 0.85); /* 粉色半透明背景 */
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-content {
            width: 90%;
            max-width: 800px;
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(230, 57, 139, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: #fff5f8;
            transform: scale(1.1);
        }

        .modal-notice-content {
            min-height: 300px;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 18px;
            color: #333;
        }

        /* 编辑模式样式 - 粉色主题 */
        .edit-mode {
            border: 2px dashed #e6398b !important;
            background-color: white !important;
            outline: none;
            resize: both;
        }
    </style>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 标题栏 -->
    <div class="header">🏫 初二3班 管理系统</div>

    <!-- 导航按钮区域 -->
    <div class="nav-container">
        <!-- 第一个页面跳转按钮 - 考勤系统 -->
        <button class="nav-btn" onclick="openPage('考勤系统.html')">
            <i class="fas fa-clipboard-check"></i>
            <span>🐱 班级可爱考勤系统 🐱</span>
        </button>
        <!-- 第二个页面跳转按钮 - 作业登记 -->
        <button class="nav-btn" onclick="openPage('作业登记.html')">
            <i class="fas fa-homework"></i>
            <span>🎀 初二3班作业登记</span>
        </button>
    </div>

    <!-- 公告栏区域 -->
    <div class="notice-section">
        <div class="notice-title">
            <span>📢 班级公告</span>
            <button class="notice-edit" id="editBtn">编辑公告</button>
        </div>
        <div class="notice-content" id="noticeContent" onclick="openFullscreenNotice()">
            欢迎使用初二3班管理系统！
            <br><br>
            【公告说明】
            <br>
            1. 点击"编辑公告"可修改此区域内容
            <br>
            2. 点击公告内容区域可全屏查看
            <br>
            3. 请及时关注班级最新通知
        </div>
    </div>

    <!-- 全屏公告弹窗 -->
    <div class="fullscreen-modal" id="fullscreenModal">
        <span class="modal-close" onclick="closeFullscreenNotice()">&times;</span>
        <div class="modal-content">
            <div class="modal-notice-content" id="modalNoticeContent"></div>
        </div>
    </div>

    <script>
        // 跳转页面函数
        function openPage(pageUrl) {
            // 打开新标签页
            window.open(pageUrl, '_blank');
            // 如果需要在当前页面打开，使用：window.location.href = pageUrl;
        }

        // 公告栏编辑相关
        let isEditing = false;
        const noticeContent = document.getElementById('noticeContent');
        const editBtn = document.getElementById('editBtn');

        // 编辑公告按钮点击事件
        editBtn.addEventListener('click', function() {
            if (!isEditing) {
                // 进入编辑模式
                noticeContent.contentEditable = true;
                noticeContent.classList.add('edit-mode');
                editBtn.textContent = '保存修改';
                noticeContent.focus();
                isEditing = true;
            } else {
                // 退出编辑模式并保存
                noticeContent.contentEditable = false;
                noticeContent.classList.remove('edit-mode');
                editBtn.textContent = '编辑公告';
                isEditing = false;
                // 本地存储保存公告内容
                localStorage.setItem('classNotice', noticeContent.innerHTML);
                alert('公告修改已保存！');
            }
        });

        // 打开全屏公告
        function openFullscreenNotice() {
            if (isEditing) return; // 编辑模式下不允许全屏
            const modal = document.getElementById('fullscreenModal');
            const modalContent = document.getElementById('modalNoticeContent');
            // 复制公告内容到弹窗
            modalContent.textContent = noticeContent.textContent;
            // 显示弹窗
            modal.style.display = 'flex';
            // 禁止页面滚动
            document.body.style.overflow = 'hidden';
        }

        // 关闭全屏公告
        function closeFullscreenNotice() {
            const modal = document.getElementById('fullscreenModal');
            modal.style.display = 'none';
            // 恢复页面滚动
            document.body.style.overflow = 'auto';
        }

        // 页面加载时恢复保存的公告内容
        window.addEventListener('load', function() {
            const savedNotice = localStorage.getItem('classNotice');
            if (savedNotice) {
                noticeContent.innerHTML = savedNotice;
            }
        });

        // 点击弹窗外部关闭
        document.getElementById('fullscreenModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeFullscreenNotice();
            }
        });

        // 按ESC键关闭全屏弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeFullscreenNotice();
            }
        });
    </script>
</body>
</html>
