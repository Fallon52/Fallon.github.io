<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梁开中学3班每日常规记录</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
    body{background:#fff0f5;padding:15px;max-width:1200px;margin:0 auto;}
    /* 主标题 */
    .main-title{text-align:center;font-size:26px;font-weight:bold;margin:10px 0 20px;color:#d81b60;}
    /* 顶部标签栏 */
    .tab-group{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px;}
    .tab-btn{padding:10px 18px;border:none;border-radius:12px;background:#ffcdd2;color:#c2185b;font-weight:bold;cursor:pointer;transition:0.2s;font-size:15px;}
    .tab-btn.active{background:#d81b60;color:white;box-shadow:0 2px 6px rgba(216,27,96,0.3);}
    /* 页面容器 */
    .page{display:none;background:white;padding:20px;border-radius:16px;box-shadow:0 2px 10px rgba(216,27,96,0.15);margin-bottom:15px;}
    .page.active{display:block;}
    .page-title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:12px;color:#c2185b;}
    /* 提示栏 */
    .tip{background:#ffebee;padding:10px 14px;border-radius:10px;margin-bottom:15px;font-size:14px;color:#880e4f;line-height:1.5;border:1px solid #ffcdd2;}
    /* 星期选择栏 */
    .week-bar{display:flex;gap:8px;justify-content:center;margin-bottom:15px;}
    .week-btn{padding:6px 12px;border:none;border-radius:8px;background:#ffcdd2;color:#c2185b;cursor:pointer;}
    .week-btn.active{background:#d81b60;color:white;}
    /* 值日表格 */
    .duty-table{width:100%;border-collapse:collapse;margin-bottom:15px;}
    .duty-table th,.duty-table td{border:1px solid #ffcdd2;padding:8px;text-align:center;font-size:13px;}
    .duty-table th{background:#ffebee;color:#c2185b;}
    /* 通用学生按钮 */
    .student-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:15px;}
    .student-btn{padding:9px;border:none;border-radius:10px;background:#ffcdd2;color:#c2185b;font-weight:bold;cursor:pointer;}
    .student-btn.marked{background:#d81b60;color:white;}
    /* 公区值日分类按钮 */
    .btn-excel-pub{background:#66bb6a;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;margin:2px;}
    .btn-late{background:#ffb74d;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;margin:2px;}
    .btn-finish-sweep{background:#7986cb;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;margin:2px;}
    /* 课室值日分类按钮 */
    .btn-excel{background:#66bb6a;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;margin:2px;}
    .btn-careless{background:#ff9800;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;margin:2px;}
    .btn-makeup{background:#29b6f6;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;margin:2px;}
    .btn-finish{background:#ab47bc;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;margin:2px;}
    /* 中午值日布局 */
    .noon-wrap{max-width:700px;margin:0 auto;}
    .noon-row{display:flex;align-items:center;margin:10px 0;gap:10px;}
    .noon-label{width:120px;font-weight:bold;color:#c2185b;}
    select{padding:6px;border:1px solid #ffcdd2;border-radius:6px;color:#c2185b;min-width:140px;}
    .sign-btn{padding:6px 12px;background:#d81b60;color:white;border:none;border-radius:6px;cursor:pointer;}
    .sign-btn.signed{background:#66bb6a;}
    /* 记录区域 */
    .log-box{margin-top:10px;}
    .log-title{font-weight:bold;margin-bottom:8px;font-size:15px;color:#c2185b;}
    .log-content{background:#fff5f8;padding:12px;border-radius:10px;max-height:260px;overflow-y:auto;line-height:1.6;font-size:14px;border:1px solid #ffcdd2;}
    /* 功能按钮栏 */
    .btn-bar{margin-top:15px;display:flex;gap:10px;flex-wrap:wrap;}
    .clear-btn{padding:8px 14px;border:none;border-radius:10px;background:#f44336;color:white;cursor:pointer;}
</style>
</head>
<body>

<div class="main-title">🐱 梁开中学3班每日常规记录 🐱</div>

<div class="tab-group">
    <button class="tab-btn active" data-page="public">🏞️ 公区值日</button>
    <button class="tab-btn" data-page="class">🏠 课室值日</button>
    <button class="tab-btn" data-page="noon">☀️ 中午值日</button>
    <button class="tab-btn" data-page="night">🌙 晚修纪律</button>
</div>

<!-- 公区值日 -->
<div class="page active" id="publicPage">
    <div class="page-title">🏞️ 公区值日登记</div>
    <div class="tip">💡 状态：优秀🟢、迟到🔶、已补扫🔵 | 迟到：课间补值日+中午留堂补早读</div>
    <div class="week-bar">
        <button class="week-btn active" data-w="周一">周一</button>
        <button class="week-btn" data-w="周二">周二</button>
        <button class="week-btn" data-w="周三">周三</button>
        <button class="week-btn" data-w="周四">周四</button>
        <button class="week-btn" data-w="周五">周五</button>
    </div>
    <table class="duty-table" id="publicDuty"></table>
    <div class="log-box">
        <div class="log-title">📝 值日状态台账</div>
        <div class="log-content" id="publicLog"></div>
    </div>
    <div class="btn-bar">
        <button class="clear-btn" onclick="clearPage('public')">🗑️ 清空本页记录</button>
    </div>
</div>

<!-- 课室值日 -->
<div class="page" id="classPage">
    <div class="page-title">🏠 课室值日登记</div>
    <div class="tip">💡 状态：优秀🟢、马虎🟠、课间需补值🔵、已补值🟣 | 马虎：课间补值日+扣除德育分</div>
    <div class="week-bar">
        <button class="week-btn active" data-w="周一">周一</button>
        <button class="week-btn" data-w="周二">周二</button>
        <button class="week-btn" data-w="周三">周三</button>
        <button class="week-btn" data-w="周四">周四</button>
        <button class="week-btn" data-w="周五">周五</button>
    </div>
    <table class="duty-table" id="classDuty"></table>
    <div class="log-box">
        <div class="log-title">📝 值日状态记录</div>
        <div class="log-content" id="classLog"></div>
    </div>
    <div class="btn-bar">
        <button class="clear-btn" onclick="clearPage('class')">🗑️ 清空本页记录</button>
    </div>
</div>

<!-- 中午值日 -->
<div class="page" id="noonPage">
    <div class="page-title">☀️ 中午值日签到登记</div>
    <div class="tip">💡 选择对应岗位学生，点击签到完成登记</div>
    <div class="noon-wrap" id="noonWrap">
        <div class="noon-row">
            <div class="noon-label">12大组 - 扫地：</div>
            <select id="noon1Sweep"></select>
            <button class="sign-btn" data-id="noon1Sweep">✅ 签到</button>
        </div>
        <div class="noon-row">
            <div class="noon-label">12大组 - 拖地：</div>
            <select id="noon1Mop"></select>
            <button class="sign-btn" data-id="noon1Mop">✅ 签到</button>
        </div>
        <div class="noon-row">
            <div class="noon-label">34大组 - 扫地：</div>
            <select id="noon2Sweep"></select>
            <button class="sign-btn" data-id="noon2Sweep">✅ 签到</button>
        </div>
        <div class="noon-row">
            <div class="noon-label">34大组 - 拖地：</div>
            <select id="noon2Mop"></select>
            <button class="sign-btn" data-id="noon2Mop">✅ 签到</button>
        </div>
        <div class="noon-row">
            <div class="noon-label">走廊：</div>
            <select id="noonCorridor"></select>
            <button class="sign-btn" data-id="noonCorridor">✅ 签到</button>
        </div>
        <div class="noon-row">
            <div class="noon-label">倒垃圾/清洁架子：</div>
            <select id="noonTrash"></select>
            <button class="sign-btn" data-id="noonTrash">✅ 签到</button>
        </div>
    </div>
    <div class="log-box">
        <div class="log-title">📝 中午值日签到记录</div>
        <div class="log-content" id="noonLog"></div>
    </div>
    <div class="btn-bar">
        <button class="clear-btn" onclick="clearPage('noon')">🗑️ 清空本页记录</button>
    </div>
</div>

<!-- 晚修纪律 -->
<div class="page" id="nightPage">
    <div class="page-title">🌙 晚修纪律登记</div>
    <div class="tip">💡 点击学生姓名记录违纪，自动累计本周违纪次数</div>
    <div class="student-grid" id="nightGrid"></div>
    <div class="log-box">
        <div class="log-title">📝 本周违纪次数统计</div>
        <div class="log-content" id="nightLog"></div>
    </div>
    <div class="btn-bar">
        <button class="clear-btn" onclick="clearPage('night')">🗑️ 清空本周记录</button>
    </div>
</div>

<script>
// 最新值日人员名单配置
const dutyData = {
    classRoom: {
        周一: {
            "课室右半——扫地、拖地":"胥淘然",
            "课室左半——扫地、拖地":"吴芯蕾",
            "两侧走廊扫地、拖地":"周夏旭",
            "天桥和连廊扫地、拖地":"钟佳妍",
            "课室窗台，走廊和天桥栏杆":"钟雯珺"
        },
        周二: {
            "课室右半——扫地、拖地":"欧美莹",
            "课室左半——扫地、拖地":"洪烨欣",
            "两侧走廊扫地、拖地":"冯昱钧",
            "天桥和连廊扫地、拖地":"周凯荧",
            "课室窗台，走廊和天桥栏杆":"蔡钧浩"
        },
        周三: {
            "课室右半——扫地、拖地":"段芸洁",
            "课室左半——扫地、拖地":"黄高峰",
            "两侧走廊扫地、拖地":"解勤志",
            "天桥和连廊扫地、拖地":"何俊朗",
            "课室窗台，走廊和天桥栏杆":"陈嘉俊"
        },
        周四: {
            "课室右半——扫地、拖地":"许爝耀",
            "课室左半——扫地、拖地":"徐雨彤",
            "两侧走廊扫地、拖地":"黎卓然",
            "天桥和连廊扫地、拖地":"陈卓熙",
            "课室窗台，走廊和天桥栏杆":"邓浩海"
        },
        周五: {
            "课室右半——扫地、拖地":"高晓柔",
            "课室左半——扫地、拖地":"黄潞",
            "两侧走廊扫地、拖地":"钟子承",
            "天桥和连廊扫地、拖地":"梁景烨",
            "课室窗台，走廊和天桥栏杆":"林卓熙"
        }
    },
    publicArea: {
        周一: {
            "公区1号区域":"黄继聪",
            "公区2号区域":"李诗钰",
            "公区3号区域":"梁海瑜",
            "公区4号区域":"甘成鑫",
            "公区5号区域":"罗文卓"
        },
        周二: {
            "公区1号区域":"伍柏熹",
            "公区2号区域":"陈紫荧",
            "公区3号区域":"甘婷方",
            "公区4号区域":"林明辉",
            "公区5号区域":"陈宇鹏"
        },
        周三: {
            "公区1号区域":"张上亮",
            "公区2号区域":"梁婉儿",
            "公区3号区域":"王梓萱",
            "公区4号区域":"赵祥宇",
            "公区5号区域":"刘雨悦"
        },
        周四: {
            "公区1号区域":"孟星宇",
            "公区2号区域":"廖美倩",
            "公区3号区域":"蒙嘉怡",
            "公区4号区域":"林建斌",
            "公区5号区域":"梁柏瑜"
        },
        周五: {
            "公区1号区域":"李浩明",
            "公区2号区域":"蔡文靖",
            "公区3号区域":"杜焯浩",
            "公区4号区域":"辛俊耀",
            "公区5号区域":"梁梓轩"
        }
    }
};

// 全班学生名单
const allStudents = [
    "蔡钧浩","蔡文靖","陈嘉俊","陈宇鹏","陈卓熙","陈紫荧","邓浩海","杜焯浩","段芸洁","冯昱钧",
    "甘成鑫","甘婷方","高晓柔","何俊朗","洪烨欣","黄高峰","黄继聪","黄潞","解勤志",
    "黎卓然","李浩明","李诗钰","梁柏瑜","梁海瑜","梁景烨","梁婉儿","梁梓轩","廖美倩","林建斌",
    "林明辉","林卓熙","刘雨悦","罗文卓","蒙嘉怡","孟星宇","欧美莹","王梓萱","伍柏熹","辛俊耀",
    "胥淘然","徐雨彤","许爝耀","张上亮","赵祥宇","钟佳妍","钟雯珺","钟子承","周凯荧","周夏旭","吴芯蕾"
];

let currentWeek = "周一";
const weekBtns = document.querySelectorAll(".week-btn");

// 本地存储工具
function get(key){return JSON.parse(localStorage.getItem(key))||[]}
function set(key,val){localStorage.setItem(key,JSON.stringify(val))}

// 切换星期
weekBtns.forEach(b=>{
    b.onclick = ()=>{
        weekBtns.forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        currentWeek = b.dataset.w;
        renderDuty();
    }
});

// 渲染公区+课室值日表格
function renderDuty(){
    // 公区值日表格：优秀、迟到、已补扫
    const pubTable = document.getElementById("publicDuty");
    const pub = dutyData.publicArea[currentWeek];
    let pubHtml = "<tr><th>公区区域</th><th>值日生</th><th>状态登记</th></tr>";
    for(let k in pub){
        const name = pub[k];
        pubHtml += `<tr>
            <td>${k}</td>
            <td>${name}</td>
            <td>
                <button class="btn-excel-pub" data-type="优秀" data-name="${name}">优秀</button>
                <button class="btn-late" data-type="迟到" data-name="${name}">迟到</button>
                <button class="btn-finish-sweep" data-type="已补扫" data-name="${name}">已补扫</button>
            </td>
        </tr>`;
    }
    pubTable.innerHTML = pubHtml;

    // 课室值日表格
    const clsTable = document.getElementById("classDuty");
    const cls = dutyData.classRoom[currentWeek];
    let clsHtml = "<tr><th>值日岗位</th><th>值日生</th><th>状态登记</th></tr>";
    for(let k in cls){
        const name = cls[k];
        clsHtml += `<tr>
            <td>${k}</td>
            <td>${name}</td>
            <td>
                <button class="btn-excel" data-type="优秀" data-name="${name}">优秀</button>
                <button class="btn-careless" data-type="马虎" data-name="${name}">马虎</button>
                <button class="btn-makeup" data-type="课间需补值" data-name="${name}">课间需补值</button>
                <button class="btn-finish" data-type="已补值" data-name="${name}">已补值</button>
            </td>
        </tr>`;
    }
    clsTable.innerHTML = clsHtml;

    bindDutyBtn();
    refreshAllLog();
}

// 绑定公区、课室的操作按钮
function bindDutyBtn(){
    // 公区按钮事件
    document.querySelectorAll(".btn-excel-pub,.btn-late,.btn-finish-sweep").forEach(b=>{
        b.onclick = ()=>{
            const name = b.dataset.name;
            const type = b.dataset.type;
            addPublicRecord(name, type);
        }
    });
    // 课室按钮事件
    document.querySelectorAll(".btn-excel,.btn-careless,.btn-makeup,.btn-finish").forEach(b=>{
        b.onclick = ()=>{
            const name = b.dataset.name;
            const type = b.dataset.type;
            addClassRecord(name, type);
        }
    });
}

// 公区值日添加记录
function addPublicRecord(name, type){
    const arr = get("public");
    const time = new Date().toLocaleString();
    arr.push({name,type,time,week:currentWeek});
    set("public",arr);
    refreshLog("public");
}

// 课室值日添加记录
function addClassRecord(name, type){
    const arr = get("class");
    const time = new Date().toLocaleString();
    arr.push({name,type,time,week:currentWeek});
    set("class",arr);
    refreshLog("class");
}

// 初始化中午值日下拉选框
function initNoonSelect(){
    const selectList = ["noon1Sweep","noon1Mop","noon2Sweep","noon2Mop","noonCorridor","noonTrash"];
    selectList.forEach(id=>{
        const sel = document.getElementById(id);
        sel.innerHTML = "<option value=''>请选择学生</option>";
        allStudents.forEach(name=>{
            sel.innerHTML += `<option value="${name}">${name}</option>`;
        });
    });
    // 绑定签到按钮
    document.querySelectorAll(".sign-btn").forEach(btn=>{
        btn.onclick = ()=>{
            const selId = btn.dataset.id;
            const sel = document.getElementById(selId);
            const name = sel.value;
            if(!name) return alert("请先选择学生！");
            const time = new Date().toLocaleString();
            const pos = sel.previousElementSibling.previousElementSibling.innerText;
            const arr = get("noon");
            arr.push({position:pos,name,time,week:currentWeek});
            set("noon",arr);
            btn.classList.add("signed");
            setTimeout(()=>btn.classList.remove("signed"),1000);
            refreshLog("noon");
        }
    });
}

// 生成晚修纪律学生按钮
function buildStudentGrid(){
    const box = document.getElementById("nightGrid");
    box.innerHTML = "";
    allStudents.forEach(name=>{
        const btn = document.createElement("button");
        btn.className = "student-btn";
        btn.textContent = name;
        btn.onclick = ()=>{
            addNightCount(name);
            btn.classList.toggle("marked");
        };
        box.appendChild(btn);
    });
}

// 晚修纪律累计次数
function addNightCount(name){
    const arr = get("night");
    const item = arr.find(i=>i.name===name);
    const time = new Date().toLocaleString();
    if(item){item.count++;item.time=time;}
    else arr.push({name,count:1,time});
    set("night",arr);
    refreshLog("night");
}

// 刷新单页记录
function refreshLog(page){
    const el = document.getElementById(page+"Log");
    const arr = get(page);
    switch(page){
        case "public":
            el.innerHTML = arr.map(i=>`[${i.week}] ${i.name} - ${i.type} - ${i.time}`).join("<br>") || "暂无记录";
            break;
        case "class":
            el.innerHTML = arr.map(i=>`[${i.week}] ${i.name} - 状态：${i.type} - ${i.time}`).join("<br>") || "暂无记录";
            break;
        case "noon":
            el.innerHTML = arr.map(i=>`[${i.week}] ${i.position}：${i.name} - 签到时间：${i.time}`).join("<br>") || "暂无记录";
            break;
        case "night":
            el.innerHTML = arr.filter(i=>i.count>0).map(i=>`${i.name} · 本周违纪 ${i.count} 次 · 最后：${i.time}`).join("<br>") || "暂无记录";
            break;
    }
}

// 刷新全部记录
function refreshAllLog(){
    ["public","class","noon","night"].forEach(refreshLog);
}

// 清空页面记录
function clearPage(page){
    if(!confirm(`确定清空当前页面所有记录？`)) return;
    localStorage.removeItem(page);
    refreshLog(page);
    document.querySelectorAll(".student-btn").forEach(b=>b.classList.remove("marked"));
}

// 顶部标签切换
const tabBtns = document.querySelectorAll(".tab-btn");
const pages = document.querySelectorAll(".page");
tabBtns.forEach((btn,idx)=>{
    btn.onclick = ()=>{
        tabBtns.forEach(b=>b.classList.remove("active"));
        pages.forEach(p=>p.classList.remove("active"));
        btn.classList.add("active");
        pages[idx].classList.add("active");
    };
});

// 页面初始化
window.onload = ()=>{
    buildStudentGrid();
    initNoonSelect();
    renderDuty();
    refreshAllLog();
}
</script>
</body>
</html>
