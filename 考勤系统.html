];

const weeks = ["周一","周二","周三","周四","周五","周日"];
let currentType = "早读";
let currentWeek = "周一";
let currentTotalType = "";
const CLEAR_PASSWORD = "578945319";

// 值日生 6:50 签到规则
const TIME_RULE = {
    早读: {early: {h:6,m:50}, normalLate: {h:6,m:50}, specialLate: {h:7,m:0}},
    晚修: {early: {h:18,m:35}, normalLate: {h:18,m:40}, specialLate: {h:18,m:45}}
};

const LONG_PRESS_TIME = 800;
const LEAVE_PRESS_TIME = 5000;
let pressTimer = null;
let leaveTimer = null;

// ===================== 存储 =====================
function getRecords(){ return JSON.parse(localStorage.getItem("sign")) || [] }
function setRecords(arr){ localStorage.setItem("sign", JSON.stringify(arr)) }
function getLeaves(){ return JSON.parse(localStorage.getItem("leave")) || [] }
function setLeaves(arr){ localStorage.setItem("leave", JSON.stringify(arr)) }

// ===================== 时间工具 =====================
function now(){
    const d = new Date();
    return `${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,0)}:${String(d.getMinutes()).padStart(2,0)}`;
}
function getTimeObj(timeStr){
    const [date, hm] = timeStr.split(' ');
    const [h,m] = hm.split(':').map(Number);
    return {h,m};
}
function toMinutes(t){ return t.h*60 + t.m }

function getLateLimit(name){
    const rule = TIME_RULE[currentType];
    return rule.normalLate;
}

function calcStatus(name, timeStr){
    const t = getTimeObj(timeStr);
    const nowMin = toMinutes(t);
    const rule = TIME_RULE[currentType];
    const earlyMin = toMinutes(rule.early);
    const lateLimitMin = toMinutes(getLateLimit(name));
    
    const isEarly = nowMin < earlyMin;
    const earlyMins = isEarly ? (earlyMin - nowMin) : 0;
    const isLate = nowMin > lateLimitMin;
    const lateMinutes = isLate ? (nowMin - lateLimitMin) : 0;
    const isSeriousLate = lateMinutes > 5;
    
    return { isEarly, earlyMins, isLate, lateMinutes, isSeriousLate };
}

// 请假状态
function isLeave(name){
    return getLeaves().some(x=>x.name===name && x.type===currentType && x.week===currentWeek);
}
function toggleLeave(name){
    const list = getLeaves();
    const idx = list.findIndex(x=>x.name===name && x.type===currentType && x.week===currentWeek);
    if(idx>-1){
        list.splice(idx,1);
        setLeaves(list);
        return false;
    }else{
        list.push({name,type:currentType,week:currentWeek});
        setLeaves(list);
        return true;
    }
}

// ===================== 班主任签到 =====================
function initTeacherBtn() {
    const btn = document.getElementById("teacherBtn");
    const timeEl = document.getElementById("teacherTime");
    const key = `TEACHER_${currentType}_${currentWeek}`;

    function refresh() {
        const records = getRecords();
        const item = records.find(x => x.key === key);
        btn.classList.toggle("signed", !!item);
        timeEl.textContent = item ? item.time : "";
    }

    btn.onclick = () => {
        const records = getRecords();
        if (records.some(x => x.key === key)) return;
        
        const time = now();
        records.push({ key, name: "班主任", type: currentType, week: currentWeek, time });
        setRecords(records);
        refresh();
    };

    refresh();
}

// ===================== 长按事件 =====================
function initBtnEvents(btn, key, name, timeEl, parentEl = null, isStudent = false) {
    function startPress() {
        pressTimer = setTimeout(() => {
            const records = getRecords();
            const recordIndex = records.findIndex(item => item.key === key);
            if (recordIndex > -1) {
                if (confirm(`确定取消【${name}】的签到记录吗？`)) {
                    records.splice(recordIndex, 1);
                    setRecords(records);
                    btn.classList.remove("signed", "late", "seriousLate");
                    timeEl.textContent = "";
                    if (isStudent && parentEl) parentEl.classList.remove("late", "seriousLate");
                    renderRank();
                }
            }
        }, LONG_PRESS_TIME);
    }
    function endPress() {
        if(pressTimer){clearTimeout(pressTimer); pressTimer=null;}
    }
    function handleClick() {
        if(isLeave(name)){alert("该生今日已请假，无法签到！"); return;}
        const records = getRecords();
        if(records.some(item=>item.key===key)) return;
        
        const time = now();
        const stat = calcStatus(name, time);
        records.push({key,name,type:currentType,week:currentWeek,time,
            isEarly:stat.isEarly,earlyMins:stat.earlyMins,
            isLate:stat.isLate,lateMinutes:stat.lateMinutes,isSeriousLate:stat.isSeriousLate});
        setRecords(records);

        btn.classList.add("signed");
        if(stat.isLate) btn.classList.add("late");
        if(stat.isSeriousLate) btn.classList.add("seriousLate");
        timeEl.textContent = time;
        
        if(isStudent && parentEl){
            if(stat.isLate) parentEl.classList.add("late");
            if(stat.isSeriousLate) parentEl.classList.add("seriousLate");
            autoDuty(name);
        }
        renderRank();
    }
    btn.addEventListener("mousedown", startPress);
    btn.addEventListener("mouseup", endPress);
    btn.addEventListener("mouseleave", endPress);
    btn.addEventListener("touchstart", startPress);
    btn.addEventListener("touchend", endPress);
    btn.addEventListener("click", handleClick);
}

// 长按名字 5 秒 请假
function initLeaveName(nameEl, name, itemEl){
    function startLeave(){
        leaveTimer = setTimeout(()=>{
            const res = toggleLeave(name);
            if(res){
                itemEl.classList.add("leave");
                alert(`${name} 已标记为请假`);
            }else{
                itemEl.classList.remove("leave");
                alert(`${name} 已取消请假`);
            }
            refreshStudents();
            renderRank();
        }, LEAVE_PRESS_TIME);
    }
    function endLeave(){
        if(leaveTimer){clearTimeout(leaveTimer); leaveTimer=null;}
    }
    nameEl.addEventListener("mousedown", startLeave);
    nameEl.addEventListener("mouseup", endLeave);
    nameEl.addEventListener("mouseleave", endLeave);
    nameEl.addEventListener("touchstart", startLeave);
    nameEl.addEventListener("touchend", endLeave);
}

// ===================== 渲染 =====================
function renderDuty(){
    const b = document.getElementById("dutyBody");
    b.innerHTML = "";
    const jobs = dutyConfig[currentWeek];
    
    for(let p in jobs){
        const name = jobs[p];
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${p}</td><td>${name}</td><td><button class="sign-btn">签到</button></td><td><div class="time-text"></div></td>`;
        b.appendChild(tr);
        
        const btn = tr.querySelector(".sign-btn");
        const timeEl = tr.querySelector(".time-text");
        const key = `D_${currentType}_${currentWeek}_${p}_${name}`;
        initBtnEvents(btn, key, name, timeEl);
    }
    refreshDuty();
}

function renderStudents(){
    const g = document.getElementById("studentGrid");
    g.innerHTML = "";
    
    studentList.forEach(name=>{
        const item = document.createElement("div");
        item.className = "student-item";
        if(isLeave(name)) item.classList.add("leave");
        item.innerHTML = `<div class="student-name">${name}</div>
                          <button class="student-btn">签到</button>
                          <div class="time-text"></div>
                          <div class="leave-text">${isLeave(name)?'【请假】':''}</div>`;
        g.appendChild(item);
        
        const btn = item.querySelector(".student-btn");
        const timeEl = item.querySelector(".time-text");
        const nameEl = item.querySelector(".student-name");
        const key = `S_${currentType}_${currentWeek}_${name}`;
        
        initBtnEvents(btn, key, name, timeEl, item, true);
        initLeaveName(nameEl, name, item);
    });
    refreshStudents();
}

function autoDuty(stuName){
    const jobs = dutyConfig[currentWeek];
    for(let p in jobs){
        if(jobs[p] === stuName){
            const key = `D_${currentType}_${currentWeek}_${p}_${stuName}`;
            const list = getRecords();
            if(!list.some(i=>i.key===key)){
                const time = now();
                const stat = calcStatus(stuName, time);
                list.push({key,name:stuName,type:currentType,week:currentWeek,time,
                    isEarly:stat.isEarly,earlyMins:stat.earlyMins,
                    isLate:stat.isLate,lateMinutes:stat.lateMinutes,isSeriousLate:stat.isSeriousLate});
                setRecords(list);
            }
        }
    }
    renderDuty();
}

function refreshDuty(){
    const list = getRecords();
    document.querySelectorAll(".sign-btn").forEach(btn=>{
        const row = btn.closest("tr");
        const timeEl = row.querySelector(".time-text");
        const name = row.children[1].textContent;
        const p = row.children[0].textContent;
        const key = `D_${currentType}_${currentWeek}_${p}_${name}`;
        const item = list.find(x=>x.key===key);
        if(item){btn.classList.add("signed"); timeEl.textContent = item.time;}
    });
}

function refreshStudents(){
    const list = getRecords();
    const leaves = getLeaves();
    document.querySelectorAll(".student-item").forEach(item=>{
        const name = item.querySelector(".student-name").textContent;
        const btn = item.querySelector(".student-btn");
        const timeEl = item.querySelector(".time-text");
        const leaveEl = item.querySelector(".leave-text");
        const key = `S_${currentType}_${currentWeek}_${name}`;
        const data = list.find(x=>x.key===key);
        const isLv = isLeave(name);
        
        btn.classList.toggle("signed", !!data);
        btn.classList.toggle("late", data?.isLate);
        btn.classList.toggle("seriousLate", data?.isSeriousLate);
        timeEl.textContent = data?.time || "";
        item.classList.toggle("late", data?.isLate);
        item.classList.toggle("seriousLate", data?.isSeriousLate);
        item.classList.toggle("leave", isLv);
        leaveEl.textContent = isLv ? "【请假】" : "";
    });
}

function changeTheme(){
    document.body.classList.toggle("night", currentType==="晚修");
}

function renderRank(){
    const type = currentType;
    const leaves = getLeaves().filter(x=>x.type===type);
    const arr = studentList.map(name=>{
        const recs = getRecords().filter(x=>x.type===type && x.name===name);
        const totalEarlyMins = recs.reduce((sum,r)=>sum+(r.earlyMins||0),0);
        const lateCount = recs.filter(x=>x.isLate).length;
        const leaveCount = leaves.filter(x=>x.name===name).length;
        return {name, totalEarlyMins, lateCount, leaveCount};
    });
    
    const red = [...arr].sort((a,b)=>b.totalEarlyMins-a.totalEarlyMins).slice(0,10);
    const black = [...arr].sort((a,b)=>b.lateCount-a.lateCount).slice(0,10);
    
    document.getElementById("redRank").innerHTML = red.map((i,n)=>`${n+1}. ${i.name} · 早到 ${i.totalEarlyMins}分钟`).join("<br>")||"暂无数据";
    document.getElementById("blackRank").innerHTML = black.map((i,n)=>`${n+1}. ${i.name} · 迟到 ${i.lateCount}次`).join("<br>")||"暂无数据";
}

function renderAll(){
    renderDuty();
    renderStudents();
    initTeacherBtn();
    changeTheme();
    renderRank();
}

// ===================== 切换 =====================
document.querySelectorAll(".type-btn").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentType = btn.dataset.type;
        renderAll();
    }
});
document.querySelectorAll(".week-btn").forEach(btn=>{
    btn.onclick = ()=>{

        btn.classList.add("active");

    }
});

// ===================== 清空 =====================
function clearToday(){
    let records = getRecords().filter(x=>!(x.week===currentWeek && x.type===currentType));
    let leaves = getLeaves().filter(x=>!(x.week===currentWeek && x.type===currentType));
    setRecords(records);
    setLeaves(leaves);
    renderAll();
}
function clearAllWithPassword(){
    const pwd = prompt("请输入清空全部密码：");
    if(pwd!==CLEAR_PASSWORD) return alert("密码错误！");
    if(confirm("确定清空所有数据？")){
        localStorage.removeItem("sign");
        localStorage.removeItem("leave");
        renderAll();
        alert("已清空所有数据！");
    }
}

// ===================== 统计 =====================
function stats(name,type){
    const list = getRecords().filter(x=>x.type===type && x.name===name);
    const leaves = getLeaves().filter(x=>x.type===type && x.name===name);
    let early=0,late=0,no=0,lv=0;
    weeks.forEach(w=>{
        if(leaves.some(x=>x.week===w)){lv++; return;}
        const item = list.find(x=>x.week===w);
        if(!item) no++;
        else if(item.isLate) late++;
        else early++;
    });
    return {early,late,no,lv};
}

// ===================== 总表 & 导出 =====================
function showTotal(type){
    currentTotalType = type;
    const area = document.getElementById("totalArea");
    const title = document.getElementById("totalTitle");
    const head = document.getElementById("totalHead");
    const body = document.getElementById("totalBody");
    const nightBtn = document.getElementById("nightExportBtn");
    
    area.style.display = "block";
    title.textContent = type+" 考勤总表";
    nightBtn.style.display = type==="晚修"?"inline-block":"none";
    
    head.innerHTML = `<tr><th>类型</th><th>学号</th><th>姓名</th>${weeks.map(w=>`<th>${w}</th>`).join("")}<th>早到</th><th>迟到</th><th>未签</th><th>请假</th></tr>`;
    body.innerHTML = "";
    
    const list = getRecords().filter(x=>x.type===type);
    const leaves = getLeaves().filter(x=>x.type===type);
    
    studentList.forEach(name=>{
        const id = studentIdMap[name] || "";
        const {early,late,no,lv} = stats(name,type);
        const tr = document.createElement("tr");
        let td = `<td>学生</td><td>${id}</td><td>${name}</td>`;
        weeks.forEach(ww=>{
            const isLv = leaves.some(x=>x.name===name && x.week===ww);
            const item = list.find(x=>x.key===`S_${type}_${ww}_${name}`);
            td += `<td>${isLv?"请假":(item?item.time:"未签")}</td>`;
        });
        td += `<td>${early}</td><td>${late}</td><td>${no}</td><td>${lv}</td>`;
        tr.innerHTML = td;
        body.appendChild(tr);
    });
}

function exportExcel(){
    const type = currentTotalType;
    const list = getRecords().filter(x=>x.type===type);
    const leaves = getLeaves().filter(x=>x.type===type);
    let csv = "类型,学号,姓名,"+weeks.join(",")+",早到,迟到,未签,请假\n";
    
    studentList.forEach(name=>{
        const id = studentIdMap[name] || "";
        const {early,late,no,lv} = stats(name,type);
        let line = `学生,${id},${name}`;
        weeks.forEach(ww=>{
            const isLv = leaves.some(x=>x.name===name && x.week===ww);
            const item = list.find(x=>x.key===`S_${type}_${ww}_${name}`);
            line += `,${isLv?"请假":(item?item.time:"未签")}`;
        });
        csv += line + `,${early},${late},${no},${lv}\n`;
    });
    
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
    a.download = `${type}考勤表.csv`;
    a.click();
}
