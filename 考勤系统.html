<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 班级可爱考勤系统 🐱</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
}
body {
    background: #fff5f8 url('https://img.lovepik.com/background/20211021/large/lovepik-cute-cat-cartoon-background-image_400179310.jpg') repeat fixed;
    background-size: 200px;
    padding: 10px;
    max-width: 1800px;
    margin: 0 auto;
    position: relative;
}
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.85);
    z-index: -1;
}
/* 锁定后绿色主题 */
body.locked-theme {
    background: #f0f8f0;
}
body.locked-theme::before {
    background: rgba(255,255,255,0.85);
}
body.locked-theme .left-box,
body.locked-theme .right-box,
body.locked-theme .total-table-area {
    border-color: #4CAF50;
}
body.locked-theme .box-title,
body.locked-theme .title,
body.locked-theme .student-name,
body.locked-theme .time-text {
    color: #2E7D32;
}
body.locked-theme .table th,
body.locked-theme .total-table th {
    background: #E8F5E8;
    color: #2E7D32;
}
body.locked-theme .table th,
body.locked-theme .table td,
body.locked-theme .total-table th,
body.locked-theme .total-table td {
    border-color: #A5D6A7;
}
body.locked-theme .student-item {
    border-color: #A5D6A7;
    background: #f0f8f0;
}

.title {
    text-align: center;
    font-size: 26px;
    margin-bottom: 10px;
    color: #e6398b;
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(230,57,139,0.2);
}
.func-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
}
.type-btn {
    padding: 6px 18px;
    border: none;
    border-radius: 50px;
    background: #ffc0cb;
    color: #e6398b;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
}
.type-btn.active {
    background: #e6398b;
    color: white;
}
body.locked-theme .type-btn {
    background: #c8e6c9;
    color: #2E7D32;
}
body.locked-theme .type-btn.active {
    background: #4CAF50;
    color: white;
}

.week-btn {
    padding: 6px 14px;
    border: none;
    border-radius: 50px;
    background: #ffd6e0;
    font-size: 14px;
    cursor: pointer;
    color: #e6398b;
}
.week-btn.active {
    background: #e6398b;
    color: white;
}
body.locked-theme .week-btn {
    background: #c8e6c9;
    color: #2E7D32;
}
body.locked-theme .week-btn.active {
    background: #4CAF50;
    color: white;
}

.total-btn {
    padding: 6px 18px;
    border: none;
    border-radius: 50px;
    background: #ff99b4;
    color: white;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
}
body.locked-theme .total-btn {
    background: #66BB6A;
}

/* 锁按钮样式 */
.lock-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 50px;
    background: #f0f0f0;
    color: #666;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}
.lock-btn.locked {
    background: #4CAF50;
    color: white;
}

.main-container {
    display: flex;
    gap: 15px;
    align-items: flex-start;
    margin-bottom: 15px;
}
.left-box {
    width: 360px;
    background: white;
    padding: 12px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(230,57,139,0.1);
    border: 2px solid #ffc0cb;
}
.box-title {
    text-align: center;
    font-size: 18px;
    margin-bottom: 10px;
    color: #e6398b;
    font-weight: bold;
    border-bottom: 2px solid #ffc0cb;
    padding-bottom: 6px;
}
.table {
    width: 100%;
    border-collapse: collapse;
}
.table th, .table td {
    border: 1px solid #ffc0cb;
    padding: 6px 4px;
    text-align: center;
    font-size: 13px;
}
.table th {
    background: #ffe6ee;
    color: #e6398b;
}
.sign-btn {
    width: 100%;
    padding: 5px;
    border: none;
    border-radius: 50px;
    background: #ffc0cb;
    color: #e6398b;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}
.sign-btn.signed {
    background: #e6398b;
    color: white;
}
.sign-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
body.locked-theme .sign-btn {
    background: #c8e6c9;
    color: #2E7D32;
}
body.locked-theme .sign-btn.signed {
    background: #4CAF50;
    color: white;
}

.time-text {
    font-size: 14px;
    color: #e6398b;
    font-weight: bold;
}
.right-box {
    flex: 1;
    background: white;
    padding: 12px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(230,57,139,0.1);
    border: 2px solid #ffc0cb;
}
.student-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
}
.student-item {
    border: 2px solid #ffc0cb;
    border-radius: 10px;
    padding: 6px;
    text-align: center;
    background: #fff5f8;
}
.student-name {
    font-weight: bold;
    margin-bottom: 4px;
    font-size: 13px;
    color: #e6398b;
}
.student-btn {
    width: 100%;
    padding: 4px;
    border: none;
    border-radius: 50px;
    background: #ffc0cb;
    color: #e6398b;
    cursor: pointer;
    font-size: 12px;
    margin-bottom: 3px;
    font-weight: bold;
}
.student-btn.signed {
    background: #e6398b;
    color: white;
}
.student-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
body.locked-theme .student-btn {
    background: #c8e6c9;
    color: #2E7D32;
}
body.locked-theme .student-btn.signed {
    background: #4CAF50;
    color: white;
}

.btn-bar {
    text-align: center;
    margin-bottom: 15px;
}
.clear-btn {
    padding: 6px 18px;
    border: none;
    border-radius: 50px;
    background: #ff6b9e;
    color: white;
    cursor: pointer;
    font-size: 14px;
    margin: 0 6px;
    font-weight: bold;
}
.clear-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
body.locked-theme .clear-btn {
    background: #66BB6A;
}

.total-table-area {
    background: white;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(230,57,139,0.1);
    border: 2px solid #ffc0cb;
    display: none;
}
.total-table-title {
    text-align: center;
    font-size: 20px;
    color: #e6398b;
    margin-bottom: 12px;
    font-weight: bold;
}
.total-table {
    width: 100%;
    border-collapse: collapse;
}
.total-table th, .total-table td {
    border: 1px solid #ffc0cb;
    padding: 6px 4px;
    text-align: center;
    font-size: 12px;
}
.total-table th {
    background: #ffe6ee;
    color: #e6398b;
}
.export-btn {
    padding: 8px 24px;
    border: none;
    border-radius: 50px;
    background: #e6398b;
    color: white;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    margin: 15px auto 0;
    display: block;
}
body.locked-theme .export-btn {
    background: #4CAF50;
}
</style>
</head>
<body>

<div class="title">🐱 班级可爱考勤系统 🐱</div>

<div class="func-bar">
    <button class="type-btn active" data-type="早读">早读考勤</button>
    <button class="type-btn" data-type="晚修">晚修考勤</button>

    <button class="week-btn active" data-week="周一">周一</button>
    <button class="week-btn" data-week="周二">周二</button>
    <button class="week-btn" data-week="周三">周三</button>
    <button class="week-btn" data-week="周四">周四</button>
    <button class="week-btn" data-week="周五">周五</button>
    <button class="week-btn" data-week="周日">周日</button>

    <button class="lock-btn" id="lockBtn">🔒 锁定当前界面</button>

    <button class="total-btn" onclick="showTotal('早读')">📊 早读总表</button>
    <button class="total-btn" onclick="showTotal('晚修')">📊 晚修总表</button>
</div>

<div class="main-container">
    <div class="left-box">
        <div class="box-title">🧹 值日生签到</div>
        <table class="table">
            <thead>
                <tr>
                    <th>岗位</th>
                    <th>值日人员</th>
                    <th>签到</th>
                    <th>时间</th>
                </tr>
            </thead>
            <tbody id="dutyBody"></tbody>
        </table>
    </div>

    <div class="right-box">
        <div class="box-title">👧🏻👦 学生签到</div>
        <div class="student-grid" id="studentGrid"></div>
    </div>
</div>

<div class="btn-bar">
    <button class="clear-btn" onclick="clearToday()">🗑️ 清空今日签到</button>
    <button class="clear-btn" onclick="clearAll()">🗑️ 清空全部记录</button>
</div>

<div class="total-table-area" id="totalArea">
    <div class="total-table-title" id="totalTitle"></div>
    <table class="total-table">
        <thead id="totalHead"></thead>
        <tbody id="totalBody"></tbody>
    </table>
    <button class="export-btn" onclick="exportTotal()">💾 导出Excel</button>
</div>

<script>
// ===================== 值日表 =====================
const dutyConfig = {
    周一: {一二大组:"胥淘然",三四大组:"吴芯蕾",走廊:"楠/佳/圣",天桥:"钟佳妍",栏杆:"钟雯珺",公区1:"李诗钰",公区2:"梁海瑜",公区3:"甘诚鑫",公区4:"罗文卓",公区5:"黄继聪"},
    周二: {一二大组:"欧美莹",三四大组:"洪烨欣",走廊:"林明辉",天桥:"周凯荧",栏杆:"蔡钧浩",公区1:"陈紫荧",公区2:"甘婷方",公区3:"冯昱钧",公区4:"陈宇鹏",公区5:"伍柏熹"},
    周三: {一二大组:"段芸洁",三四大组:"黄高峰",走廊:"赵祥宇",天桥:"何俊朗",栏杆:"陈嘉俊",公区1:"梁婉儿",公区2:"王梓萱",公区3:"解勤志",公区4:"刘雨悦",公区5:"张上亮"},
    周四: {一二大组:"许耀耀",三四大组:"徐雨彤",走廊:"黎卓然",天桥:"陈卓熙",栏杆:"邓浩海",公区1:"廖美倩",公区2:"蒙嘉怡",公区3:"林建斌",公区4:"梁柏瑜",公区5:"孟星宇"},
    周五: {一二大组:"高晓柔",三四大组:"黄潞",走廊:"钟子承",天桥:"梁景烨",栏杆:"梁梓轩",公区1:"蔡文靖",公区2:"杜焯浩",公区3:"辛俊耀",公区4:"林卓熙",公区5:"李浩明"},
    周日: {一二大组:"值日被扣分名单",三四大组:"值日被扣分名单",走廊:"值日被扣分名单",天桥:"值日被扣分名单",栏杆:"值日被扣分名单",公区1:"值日被扣分名单",公区2:"值日被扣分名单",公区3:"值日被扣分名单",公区4:"值日被扣分名单",公区5:"值日被扣分名单"}
};

// ===================== 学生名单 =====================
const studentList = [
    "蔡钧浩","黄潞","黎卓然","伍柏熹","周夏旭","钟雯珺","高晓柔","刘雨悦","段芸洁","李浩明",
    "李诗钰","梁婉儿","洪烨欣","罗文卓","黄高峰","钟佳妍","吴芯蕾","陈宇鹏","赵祥宇","林卓熙",
    "梁海瑜","周杰楠","蒙嘉怡","阳佳言","周凯荧","林建斌","辛俊耀","黄继聪","胥淘然","许雨彤",
    "杜焯浩","陈卓熙","廖美倩","冯昱钧","许爝耀","张上亮","黄圣杰","蔡文靖","钟子承","陈嘉俊",
    "甘诚鑫","甘婷方","何俊朗","解勤志","梁柏榆","陈紫荧","欧美莹","邓浩海","王梓萱","孟星宇",
    "梁景烨","梁梓轩","林明辉"
];

const weeks = ["周一","周二","周三","周四","周五","周日"];
let currentType = "早读";
let currentWeek = "周一";

const UNLOCK_PASSWORD = "578945319";

let dutyEl = [];
let studentEl = [];

// ===================== 锁定功能 =====================
function getLockKey() {
    return `LOCK_${currentType}_${currentWeek}`;
}
function isLocked() {
    return localStorage.getItem(getLockKey()) === "1";
}

function applyTheme() {
    if (isLocked()) {
        document.body.classList.add("locked-theme");
    } else {
        document.body.classList.remove("locked-theme");
    }
}

function toggleLock() {
    const key = getLockKey();
    const locked = isLocked();

    if (locked) {
        // 解锁：需要密码
        const input = prompt("请输入解锁密码：");
        if (input !== UNLOCK_PASSWORD) {
            alert("密码错误！");
            return;
        }
        localStorage.removeItem(key);
        alert("解锁成功！");
    } else {
        // 锁定
        if (!confirm("确定锁定？锁定后无法签到/清空/修改，需密码解锁！")) return;
        localStorage.setItem(key, "1");
        alert("锁定成功！");
    }

    refreshLockBtn();
    applyTheme();
    refreshButtons();
}

function refreshLockBtn() {
    const btn = document.getElementById("lockBtn");
    if (isLocked()) {
        btn.classList.add("locked");
        btn.textContent = "🔒 已锁定";
    } else {
        btn.classList.remove("locked");
        btn.textContent = "🔒 锁定当前界面";
    }
}

// ===================== 工具 =====================
function nowStr() {
    const d = new Date();
    const m = String(d.getMonth()+1).padStart(2,0);
    const day = String(d.getDate()).padStart(2,0);
    const hh = String(d.getHours()).padStart(2,0);
    const mm = String(d.getMinutes()).padStart(2,0);
    return `${m}-${day} ${hh}:${mm}`;
}
function getRecords() {
    return JSON.parse(localStorage.getItem("signRecords")) || [];
}
function setRecords(arr) {
    localStorage.setItem("signRecords", JSON.stringify(arr));
}

// ===================== 渲染值日生 =====================
function renderDuty() {
    const b = document.getElementById("dutyBody");
    b.innerHTML = "";
    dutyEl = [];
    const jobs = dutyConfig[currentWeek];
    for (let post in jobs) {
        const name = jobs[post];
        const tr = document.createElement("tr");

        const tdPost = document.createElement("td");
        tdPost.textContent = post;

        const tdName = document.createElement("td");
        tdName.textContent = name;

        const tdBtn = document.createElement("td");
        const btn = document.createElement("button");
        btn.className = "sign-btn";
        btn.textContent = "签到";
        tdBtn.appendChild(btn);

        const tdTime = document.createElement("td");
        const t = document.createElement("div");
        t.className = "time-text";
        tdTime.appendChild(t);

        tr.append(tdPost, tdName, tdBtn, tdTime);
        b.appendChild(tr);

        const key = `DUTY_${currentType}_${currentWeek}_${post}_${name}`;
        btn.onclick = () => doSign(key, name, btn, t);
        dutyEl.push({ key, btn, time: t });
    }
    refreshDuty();
    refreshButtons();
}

// ===================== 渲染学生 =====================
function renderStudents() {
    const g = document.getElementById("studentGrid");
    g.innerHTML = "";
    studentEl = [];
    studentList.forEach(name => {
        const item = document.createElement("div");
        item.className = "student-item";

        const n = document.createElement("div");
        n.className = "student-name";
        n.textContent = name;

        const btn = document.createElement("button");
        btn.className = "student-btn";
        btn.textContent = "签到";

        const t = document.createElement("div");
        t.className = "time-text";

        item.append(n, btn, t);
        g.appendChild(item);

        const key = `STU_${currentType}_${currentWeek}_${name}`;
        btn.onclick = () => doSign(key, name, btn, t);
        studentEl.push({ key, btn, time: t });
    });
    refreshStudents();
    refreshButtons();
}

// 统一禁用/启用按钮
function refreshButtons() {
    const locked = isLocked();
    dutyEl.forEach(({ btn }) => btn.disabled = locked);
    studentEl.forEach(({ btn }) => btn.disabled = locked);
    document.querySelectorAll(".clear-btn").forEach(b => b.disabled = locked);
}

// ===================== 签到 =====================
function doSign(key, name, btn, timeEl) {
    if (isLocked()) {
        alert("当前界面已锁定，无法签到！");
        return;
    }
    const list = getRecords();
    const has = list.some(x => x.key === key);
    if (has) {
        alert(name + " 今日" + currentType + "已签到！");
        return;
    }
    const time = nowStr();
    list.push({ key, name, type: currentType, week: currentWeek, time });
    setRecords(list);
    btn.classList.add("signed");
    timeEl.textContent = time;
}

// ===================== 刷新状态 =====================
function refreshDuty() {
    const list = getRecords();
    dutyEl.forEach(({ key, btn, time }) => {
        const item = list.find(x => x.key === key);
        if (item) {
            btn.classList.add("signed");
            time.textContent = item.time;
        } else {
            btn.classList.remove("signed");
            time.textContent = "";
        }
    });
}
function refreshStudents() {
    const list = getRecords();
    studentEl.forEach(({ key, btn, time }) => {
        const item = list.find(x => x.key === key);
        if (item) {
            btn.classList.add("signed");
            time.textContent = item.time;
        } else {
            btn.classList.remove("signed");
            time.textContent = "";
        }
    });
}

// ===================== 切换 =====================
document.querySelectorAll(".type-btn").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentType = btn.dataset.type;
        renderDuty();
        renderStudents();
        refreshLockBtn();
        applyTheme();
    };
});
document.querySelectorAll(".week-btn").forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll(".week-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentWeek = btn.dataset.week;
        renderDuty();
        renderStudents();
        refreshLockBtn();
        applyTheme();
    };
});
document.getElementById("lockBtn").onclick = toggleLock;

// ===================== 清空 =====================
function clearToday() {
    if (isLocked()) {
        alert("当前界面已锁定，无法清空！");
        return;
    }
    if (!confirm(`确定清空【${currentWeek}】${currentType}？`)) return;
    let list = getRecords();
    list = list.filter(x => !(x.week === currentWeek && x.type === currentType));
    setRecords(list);
    renderDuty();
    renderStudents();
}
function clearAll() {
    if (isLocked()) {
        alert("当前界面已锁定，无法清空！");
        return;
    }
    if (!confirm("确定清空全部？")) return;
    localStorage.removeItem("signRecords");
    renderDuty();
    renderStudents();
}

// ===================== 总表 =====================
function showTotal(type) {
    const area = document.getElementById("totalArea");
    const title = document.getElementById("totalTitle");
    const head = document.getElementById("totalHead");
    const body = document.getElementById("totalBody");
    area.style.display = "block";
    title.textContent = type + "考勤总表";

    head.innerHTML = `<tr><th>类别</th><th>姓名</th>${weeks.map(w=>`<th>${w}</th>`).join("")}</tr>`;
    body.innerHTML = "";

    const all = getRecords().filter(x => x.type === type);

    weeks.forEach(week => {
        const jobs = dutyConfig[week];
        for (let post in jobs) {
            const name = jobs[post];
            const row = document.createElement("tr");
            const cells = [`<td>值日生</td>`, `<td>${post}(${name})</td>`];
            weeks.forEach(w => {
                const k = `DUTY_${type}_${w}_${post}_${name}`;
                const item = all.find(x => x.key === k);
                cells.push(`<td>${item ? item.time : "未签到"}</td>`);
            });
            row.innerHTML = cells.join("");
            body.appendChild(row);
        }
    });

    studentList.forEach(name => {
        const row = document.createElement("tr");
        const cells = [`<td>学生</td>`, `<td>${name}</td>`];
        weeks.forEach(w => {
            const k = `STU_${type}_${w}_${name}`;
            const item = all.find(x => x.key === k);
            cells.push(`<td>${item ? item.time : "未签到"}</td>`);
        });
        row.innerHTML = cells.join("");
        body.appendChild(row);
    });
}

// ===================== 导出 =====================
function exportTotal() {
    alert("导出功能需要在线表格库支持，本地打开可用简易版：复制总表内容到Excel即可。");
}

// ===================== 启动 =====================
